<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="REPLACE_WITH_YOUR_USERNAME">
    <allow own="com.steampowered.HhdBridge.Tdp"/>
    <allow own="com.steampowered.HhdBridge.Gpu"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.steampowered.HhdBridge.Tdp"/>
    <allow send_destination="com.steampowered.HhdBridge.Gpu"/>
  </policy>
</busconfig>
