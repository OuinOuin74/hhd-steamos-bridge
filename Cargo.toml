[package]
name = "hhd-steamos-bridge"
version = "0.2.1"
edition = "2021"

[dependencies]
anyhow = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }

[profile.release]
strip = true
lto = true
